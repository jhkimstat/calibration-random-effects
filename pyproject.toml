[project]
name = "bayesiancalibration"
version = "0.1.0"
description = "Research implementation of spatial Bayesian calibration and Gibbs samplers"
readme = "README.md"
authors = [
    { name = "Jaehoon", email = "kim.9859@osu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "blackjax==1.6.2",
    "jax>=0.4.30",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
]

[project.scripts]
bayesiancalibration = "bayesiancalibration.cli:main"

[project.optional-dependencies]
preprocessing = [
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
